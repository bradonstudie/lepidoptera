version: "2"
sql:
  - engine: "postgresql"
    queries:
      - "internal/db/queries/shows"
      - "internal/db/queries/bands"
      - "internal/db/queries/venues"
      - "internal/db/queries/subscribers"
      - "internal/db/queries/notifications"
    schema: "internal/db/migrations"
    gen:
      go:
        package: "db"
        out: "internal/db/generated"
        emit_json_tags: true
